<!DOCTYPE html>
<html lang="en" class="light">
<head>
  <meta charset="UTF-8">
  <title>PMS Central Hub | Pro Table View</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
  <style>
    body { font-family: sans-serif; }
    /* Table Styling for proper column alignment */
    .pms-table { width: 100%; border-collapse: collapse; }
    .pms-table th, .pms-table td { padding: 12px; border-bottom: 1px solid #e2e8f0; text-align: left; }
    .action-pill { background: #eef2ff; color: #4338ca; padding: 4px 12px; border-radius: 99px; font-weight: 700; cursor: pointer; border: 1px solid #c7d2fe; }
  </style>
</head>
<body class="bg-slate-50 p-4">

  <div class="overflow-x-auto bg-white rounded-lg shadow border border-slate-200">
    <table class="pms-table text-sm">
      <thead class="bg-slate-100 text-slate-700 font-bold uppercase text-[10px]">
        <tr>
          <th>WBS</th>
          <th>Step Title</th>
          <th>Doer / Assigned To</th>
          <th>Timeline</th>
          <th>Stopwatch</th>
          <th>Remarks</th>
          <th>Status</th>
          <th>Action</th>
        </tr>
      </thead>
      <tbody id="tableRows">
        <!-- Rows will be injected here -->
      </tbody>
    </table>
  </div>

  <script>
    // Ye function aapke existing dashboard logic me replace karein
    function renderStructuredTableGrid(data) {
      const tbody = document.getElementById('tableRows');
      tbody.innerHTML = '';
      
      data.forEach(item => {
        item.steps.sort((a,b) => a.wbsNo - b.wbsNo).forEach(s => {
          const row = document.createElement('tr');
          row.innerHTML = `
            <td class="font-bold text-slate-500">#${s.wbsNo}</td>
            <td class="font-bold text-slate-900">${s.stepTitle}</td>
            <td>
              <div class="font-bold text-slate-900">${s.assignedName}</div>
              <div class="text-[10px] text-slate-400">${s.assignedEmail}</div>
            </td>
            <td class="text-[11px] text-slate-600">${new Date(s.plannedStartDate).toLocaleDateString()} ➔ ${new Date(s.plannedEndDate).toLocaleDateString()}</td>
            <td class="text-amber-600 font-mono font-bold">${s.status === 'Completed' ? 'Done' : 'Pending'}</td>
            <td class="text-slate-600 italic">${s.remarks || '-'}</td>
            <td><span class="px-2 py-1 rounded-full text-[10px] ${s.status === 'Completed' ? 'bg-green-100 text-green-700' : 'bg-red-100 text-red-700'}">${s.status}</span></td>
            <td>
              <button onclick="openDoerModal('${item.uniqueId}', '${s._id}')" class="action-pill flex items-center gap-1 text-[11px]">
                ⚡ Actions ▾
              </button>
            </td>
          `;
          tbody.appendChild(row);
        });
      });
      lucide.createIcons();
    }
  </script>
</body>
</html>

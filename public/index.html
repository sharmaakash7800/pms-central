        <!-- Custom Steps List Box -->
        <div class="bg-indigo-50/60 p-2.5 rounded-xl border space-y-1.5">
          <div class="flex justify-between items-center">
             <label class="block font-bold text-indigo-900 dark:text-indigo-200">Steps Library:</label>
             <select id="templateSelector" onchange="loadSelectedTemplate()" class="border rounded px-2 py-0.5 text-[10px] w-48">
               <option value="">-- Load Saved Template --</option>
             </select>
          </div>
          <textarea id="bulkStepsInput" rows="4" class="w-full border rounded p-2 text-xs font-mono dark:bg-slate-900 dark:text-white" placeholder="Paste your step list here..."></textarea>
          <div class="flex justify-between items-center pt-1">
            <button type="button" onclick="saveAsTemplate()" class="bg-emerald-600 hover:bg-emerald-700 text-white font-bold px-3 py-1 rounded text-[10px]">Save as Template</button>
            <button type="button" onclick="generateStepsFromBulkInput()" class="bg-indigo-600 hover:bg-indigo-700 text-white font-bold px-3 py-1 rounded text-[10px]">Generate From List</button>
          </div>
        </div>

<script>
    // 1. Load Templates Dropdown
    function updateTemplateDropdown() {
        const selector = document.getElementById('templateSelector');
        const templates = JSON.parse(localStorage.getItem('pms_saved_templates') || '[]');
        selector.innerHTML = '<option value="">-- Load Saved Template --</option>';
        templates.forEach((t, i) => {
            selector.innerHTML += `<option value="${i}">${t.name}</option>`;
        });
    }

    // 2. Save Current Steps to Library
    function saveAsTemplate() {
        const bulkText = document.getElementById('bulkStepsInput').value.trim();
        if(!bulkText) return alert('Enter steps first!');
        const name = prompt('Enter Template Name:');
        if(!name) return;

        const templates = JSON.parse(localStorage.getItem('pms_saved_templates') || '[]');
        templates.push({ name, steps: bulkText });
        localStorage.setItem('pms_saved_templates', JSON.stringify(templates));
        updateTemplateDropdown();
        alert('Template Saved!');
    }

    // 3. Load Selected Template into Textarea
    function loadSelectedTemplate() {
        const selector = document.getElementById('templateSelector');
        if(!selector.value) return;
        const templates = JSON.parse(localStorage.getItem('pms_saved_templates') || '[]');
        const template = templates[selector.value];
        document.getElementById('bulkStepsInput').value = template.steps;
        generateStepsFromBulkInput();
    }

    // Update Init
    function openCreateModal() {
      document.getElementById('editTaskIdField').value = '';
      document.getElementById('mStartDate').value = new Date().toISOString().slice(0, 10);
      document.getElementById('mProject').value = '';
      document.getElementById('mItemName').value = '';
      document.getElementById('bulkStepsInput').value = '';
      document.getElementById('stepsContainer').innerHTML = '<p class="text-xs text-slate-400 text-center py-4 italic">No steps generated yet.</p>';
      
      updateTemplateDropdown(); // Refresh templates
      toggleModal('createTaskModal', true);
    }
    
    // ... (All other existing functions remain same) ...
</script>
